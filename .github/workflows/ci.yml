name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1.65.2
        with:
          fail_level: error

  scan-secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the latest commit
      # Same tool `sundry init` scaffolds for callers (see
      # scaffold.py's CI_WORKFLOW_TEMPLATE) — the raw gitleaks CLI via its
      # official image, not the gitleaks-action wrapper (which requires a
      # paid license for organization-owned repos). Intentionally not
      # version-pinned, unlike everything else here — a secret scanner is
      # more useful current than reproducible.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner -v

  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-env
        with:
          extras: dev
          python-version: ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -v --cov=sundry --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  preview-digest:
    name: Build preview artifacts and email
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-env

      - name: Build digest and email when credentials are configured
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT || secrets.DIGEST_RECIPIENT || 'bestasitis@gmail.com' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SEND_ARGS=()
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            SEND_ARGS=(--send-email --subject-prefix "[PR Preview] " --subject-suffix " — #$PR_NUMBER")
          else
            echo "::warning::Mail credentials unavailable; preview artifacts only."
          fi
          uv run python -m sundry \
            --config examples/feeds.toml \
            --html-output digest_output/latest.html \
            --links-output digest_output/links.txt \
            --report-output digest_output/report.json \
            --no-write-cache \
            --no-archive \
            "${SEND_ARGS[@]}"

      - name: Upload preview and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest_output/
          if-no-files-found: error
