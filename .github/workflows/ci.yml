name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1.75.0
        with:
          fail_level: error

  scan-secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the latest commit
      # Same tool `sundry init` scaffolds for callers (see
      # scaffold.py's CI_WORKFLOW_TEMPLATE) — the raw gitleaks CLI via its
      # official image, not the gitleaks-action wrapper (which requires a
      # paid license for organization-owned repos). Intentionally not
      # version-pinned, unlike everything else here — a secret scanner is
      # more useful current than reproducible.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner -v

  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-env
        with:
          extras: dev
          python-version: ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -v --cov=sundry --cov-report=term-missing

  preview-digest:
    name: Build & email a preview digest
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-env

      - name: Build digest, and email a preview if mail secrets are set
        # Dry run either way (no commit, no cache write) — --send-email is
        # only added when MAIL_USERNAME/MAIL_PASSWORD are actually
        # configured, so a fork PR without those secrets still builds and
        # passes, just without a preview email.
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT || 'bestasitis@gmail.com' }}
        run: |
          SEND_ARGS=()
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            SEND_ARGS=(--send-email --subject-prefix "[PR Preview] " --subject-suffix " — #${{ github.event.pull_request.number }}")
          else
            echo "::warning::MAIL_USERNAME/MAIL_PASSWORD secrets aren't set yet, so this PR can't " \
                 "send a preview email. See README.md for setup steps; the digest still built " \
                 "successfully above."
          fi
          uv run python -m sundry \
            --config examples/feeds.toml \
            --html-output digest_output/latest.html \
            --no-write-cache \
            --no-archive \
            "${SEND_ARGS[@]}"
