name: Reusable Digest Builder

# Lets ANY repo build and email a digest with this engine, without
# forking or copying any Python code — see AGENTS.md / README.md
# "Using this without forking" for the 4-line caller workflow (or run
# `sundry init` in that repo to generate it). This checks out
# and commits back to the CALLING repo; the digest engine itself is
# installed straight from this repo's git history at `inputs.digest-ref`,
# `main` by default — this project doesn't do formal releases, so the
# documented flow just tracks main rather than asking callers to keep a
# pinned tag current. Pin to a specific tag or commit SHA instead if you
# want extra stability against upstream changes.
#
# The engine builds AND sends the digest itself (see mailer.py) — this
# workflow's only job is to run it on a schedule, pass it credentials as
# environment variables, and commit the archive afterward. There's no
# third-party mail action or separate send step here to keep in sync.
#
# This repo ships no topic of its own — its own CI (ci.yml) builds
# `examples/feeds.toml` directly from the committed uv.lock to test the
# engine, rather than calling this workflow on itself.

on:
  workflow_call:
    inputs:
      date:
        description: "UTC date to replay/search (YYYY-MM-DD); blank for today's scheduled run"
        type: string
        default: ""
      send-email:
        description: "Send email; false builds a downloadable preview only"
        type: boolean
        default: true
      config-path:
        description: "Path, in the calling repo, to the feeds.toml config."
        type: string
        default: config/feeds.toml
      digest-ref:
        description: >
          Git ref of LPF9000/sundry to install the digest
          engine from. Defaults to "main" — this project doesn't cut
          formal releases, so tracking main is the documented, tested
          path. Override with a tag or commit SHA if you'd rather pin
          against upstream changes, but it must be recent enough to
          support the CLI flags this workflow passes it — at minimum
          v2.0.0 (earlier tags predate the sundry rename) and,
          as of the engine sending its own email, past the commit that
          added --send-email; an older pin fails with an "unrecognized
          arguments" error rather than silently misbehaving.
        type: string
        default: main
      recipient:
        description: >
          Who receives the digest email. Pass your repo's own
          vars.DIGEST_RECIPIENT (recommended — variables show their
          value in the Settings UI, and an email address isn't
          sensitive). Leave this at its default and pass
          secrets.DIGEST_RECIPIENT instead if you'd rather set it as a
          secret; only one of the two needs a value.
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
      mail-server:
        type: string
        default: smtp.gmail.com
      mail-port:
        type: number
        default: 465
      mail-from-name:
        type: string
        default: "Digest Bot"
    secrets:
      MAIL_USERNAME:
        required: true
      MAIL_PASSWORD:
        required: true
      DIGEST_RECIPIENT:
        description: >
          Optional. Who receives the digest email, as an alternative to
          inputs.recipient — set this if you'd rather configure the
          recipient as a secret than a repository variable. Used only
          when inputs.recipient is empty.
        required: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # No `repository:`/`ref:` given, so this checks out the CALLING
      # repo (the one whose workflow `uses:` this file) — that's where
      # config/feeds.toml, digests/, and state/seen.json live.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Build digest and send email
        # The engine sends its own email over plain SMTP (see mailer.py)
        # — this step is the entire pipeline, fetch through send. If
        # neither inputs.recipient nor secrets.DIGEST_RECIPIENT resolves
        # to a value, --send-email fails this step with a clear reason;
        # nothing here needs to check for that separately.
        env:
          DIGEST_DATE: ${{ inputs.date }}
          SEND_EMAIL: ${{ inputs.send-email }}
          DIGEST_REF: ${{ inputs.digest-ref }}
          CONFIG_PATH: ${{ inputs.config-path }}
          MAIL_SERVER: ${{ inputs.mail-server }}
          MAIL_PORT: ${{ inputs.mail-port }}
          MAIL_FROM_NAME: ${{ inputs.mail-from-name }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DIGEST_RECIPIENT: ${{ inputs.recipient || secrets.DIGEST_RECIPIENT }}
        run: |
          args=(--require-minimums --report-output digest_output/report.json --links-output digest_output/links.txt)
          if [ -n "$DIGEST_DATE" ]; then args+=(--date "$DIGEST_DATE"); fi
          if [ "$SEND_EMAIL" = true ]; then
            args+=(--send-email)
          else
            args+=(--no-write-cache --no-archive)
          fi
          uvx --from "git+https://github.com/LPF9000/sundry.git@$DIGEST_REF" \
            sundry --config "$CONFIG_PATH" "${args[@]}" \
            --mail-server "$MAIL_SERVER" --mail-port "$MAIL_PORT" --mail-from-name "$MAIL_FROM_NAME"

      - name: Upload preview and selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest_output/

      - name: Commit archive & dedupe cache
        if: inputs.send-email && inputs.date == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          git push
