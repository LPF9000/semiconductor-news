[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sundry"
version = "1.0.0"
description = "Reusable, config-driven daily news digest builder — bring your own topic, no fork needed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0,<7",
  "requests>=2.34.2,<3",
]

[project.urls]
Homepage = "https://github.com/LPF9000/sundry"
Repository = "https://github.com/LPF9000/sundry"
Issues = "https://github.com/LPF9000/sundry/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=2.3.1",
  "types-requests",
]

[project.scripts]
sundry = "sundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["sundry"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
