# Real, full-sized example config/feeds.toml — the same semiconductor/DV
# topic as https://github.com/LPF9000/semiconductor-news-digest, kept
# here so this repo's own CI (ci.yml) exercises the whole engine against
# real sources and sends a real, substantive preview digest on every PR,
# not a token stub. This repo doesn't run on a schedule itself, though —
# no daily-digest workflow here, no default topic shipped — it's just
# what CI builds against to prove the engine actually works end to end,
# the way semiconductor-news-digest's daily run does for real.
#
# Point this engine at your OWN topic by writing a file like this one in
# your own repo and passing it via --config (or a caller workflow's
# config-path input) — see README.md's "Using this for your own topic."
#
# TOML, not YAML: parsed with Python's stdlib `tomllib` (3.11+).

# --- Top-level settings ---------------------------------------------------
# NOTE: top-level keys like these must stay above the first `[[...]]`
# array-of-tables header below — TOML attaches bare `key = value` lines to
# whichever table was most recently opened, not to the document root.

# Title used in the email/archive header and email subject line.
digest_name = "Semiconductor & DV Digest"
lookback_days = 30
max_items_per_section = 10
exclude_keywords = ["insurance", "identity verification", "age verification", "University of Vermont", "UVM Medical"]

# --- Hacker News (Algolia public API, no key needed) -----------------------

hn_queries = [
  "RISC-V",
  "UVM verification",
  "formal verification hardware",
  "hardware security",
  "chip verification",
  "open source silicon",
  "ASIC design",
  "DVCon",
  "post-quantum cryptography hardware",
  "chiplet",
  "SystemVerilog",
  "Chisel hardware",
  "hardware description language",
  "EDA flow",
]

# --- Plain RSS/Atom feeds -----------------------------------------------
# `default_category`, if set, forces every item from that feed into a
# category regardless of keyword score (useful for feeds that are already
# 100% on-topic, e.g. a pure cryptography research feed).

[[rss_sources]]
name = "Semiconductor Engineering"
url = "https://semiengineering.com/feed/"

[[rss_sources]]
name = "EE Times"
url = "https://www.eetimes.com/feed/"

[[rss_sources]]
name = "EDN"
url = "https://www.edn.com/feed/"

[[rss_sources]]
name = "IEEE Spectrum – Semiconductors"
url = "https://spectrum.ieee.org/feeds/topic/semiconductors.rss"

[[rss_sources]]
name = "SemiWiki"
url = "https://semiwiki.com/feed/"

[[rss_sources]]
name = "Chips and Cheese"
url = "https://chipsandcheese.com/feed/"

[[rss_sources]]
name = "RISC-V International"
url = "https://riscv.org/feed/"
default_category = "risc_v_proc"

[[rss_sources]]
name = "All About Circuits – News"
url = "https://www.allaboutcircuits.com/rss/news/"

[[rss_sources]]
name = "IACR Cryptology ePrint Archive"
url = "https://eprint.iacr.org/rss/rss.xml"
default_category = "crypto_security"

[[rss_sources]]
name = "Verification Horizons"
url = "https://blogs.sw.siemens.com/verificationhorizons/feed/"

# --- arXiv (public API, no key needed) -----------------------------------

[[arxiv_sources]]
name = "arXiv cs.AR (Hardware Architecture)"
query = "cat:cs.AR"
max_results = 25

[[arxiv_sources]]
name = "arXiv cs.CR (hardware-related Crypto & Security)"
query = 'cat:cs.CR AND (abs:hardware OR abs:chip OR abs:SoC OR abs:"side-channel" OR abs:silicon OR abs:FPGA OR abs:ASIC OR abs:"post-quantum")'
max_results = 25

# --- Categories, in display order ----------------------------------------
[ranking]
preferred_keywords = ["open access", "open source", "open-source", "research", "tutorial", "benchmark", "methodology"]
demoted_keywords = ["request a demo", "contact sales", "buy now", "sponsored", "press release", "announces", "launches", "register now"]
source_weights = { "arXiv Design Verification Research" = 8, "arXiv Formal Hardware Methods" = 8, "arXiv cs.AR (Hardware Architecture)" = 5, "arXiv cs.CR (hardware-related Crypto & Security)" = 5, "Chips and Cheese" = 4, "Verification Horizons" = 2 }

[[arxiv_sources]]
name = "arXiv Design Verification Research"
query = '(all:"hardware verification" OR all:"design verification" OR all:"SystemVerilog" OR all:"testbench" OR all:"RTL verification" OR all:"cocotb")'
max_results = 100

[[arxiv_sources]]
name = "arXiv Formal Hardware Methods"
query = '(cat:cs.LO OR cat:cs.SE OR cat:cs.AR) AND (all:"model checking" OR all:"equivalence checking" OR all:"hardware fuzzing" OR all:"hardware verification") AND (all:hardware OR all:RTL OR all:Verilog OR all:circuits)'
max_results = 100

# Keywords match whole terms in full titles/summaries. Title matches count
# double; contextual gates and weights refine eligibility. Ties use category
# order, and unmatched items go to general.

[[categories]]
key = "dv_uvm"
min_items = 5
min_score = 3
required_keywords = ["uvm", "systemverilog", "verilog", "rtl", "asic", "fpga", "soc", "semiconductor", "silicon", "chip", "chips", "cocotb", "pyuvm", "dvcon", "eda", "hardware verification", "hardware design verification", "hardware formal verification", "formal verification of hardware", "hardware fuzzing", "SystemC-AMS"]
exclude_keywords = ["insurance", "identity verification", "age verification", "news coverage", "code coverage for Python", "UVM Medical", "University of Vermont"]
keyword_weights = { "uvm" = 5, "testbench" = 4, "cocotb" = 5, "pyuvm" = 5, "functional coverage" = 4, "coverage closure" = 4, "hardware verification" = 5, "design verification" = 5, "formal verification" = 4, "SystemVerilog assertions" = 5, "hardware fuzzing" = 5, "equivalence checking" = 5, "information-flow verification" = 5, "property directed reachability" = 5, "RTL verification" = 5 }
title = "Design Verification, UVM & Formal"
blurb = """\
Testbenches, coverage, assertions, formal methods, and everything that \
keeps silicon honest before tapeout.\
"""
max_items = 10
keywords = [
  "uvm",
  "verification",
  "testbench",
  "formal verification",
  "coverage",
  "assertion",
  "assertions",
  "systemverilog assertions",
